[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lincc"
version = "0.1.0"
description = "Linguagem Natural em Curto-Circuito: motor validado barra a barra contra referência setorial"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Matheus Cassiano de Góes" }]
keywords = ["curto-circuito", "short-circuit", "proteção", "power-systems", "ybus"]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
